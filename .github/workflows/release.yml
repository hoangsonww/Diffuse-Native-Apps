name: Release

# Cutting a release by hand meant editing four files, remembering the tag
# format, and hoping the three platform workflows agreed on what they were
# building. They did not: v1.1.0 shipped while every version string in the tree
# still said 1.0.0.
#
# This is the one entry point. Choose a bump, and it verifies the tree is
# releasable, moves VERSION, propagates it, opens the changelog section, tags,
# and pushes. The tag is what the existing release-apple / release-macos /
# release-android workflows already listen for, so artifacts keep being built
# where they always were — this only makes starting correct and repeatable.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to increase"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      dry_run:
        description: "Work it out and report, but do not tag or push"
        required: false
        default: false
        type: boolean

permissions:
  # contents: to commit the bump and push the tag.
  # actions: to dispatch the platform release workflows — without it the
  # dispatch fails with "HTTP 403: Resource not accessible by integration",
  # which is what the token says when it may read workflows but not start them.
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  cut:
    name: Cut ${{ inputs.bump }} release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A release must not be cut from a tree that does not agree with itself.
      - name: Verify the current version is consistent
        run: ./Scripts/version.sh check

      - name: Work out the next version
        id: next
        run: |
          set -Eeuo pipefail
          current="$(./Scripts/version.sh)"
          ./Scripts/version.sh bump "${{ inputs.bump }}" >/dev/null
          next="$(./Scripts/version.sh)"
          # Leave the tree untouched for now; the real bump happens below, once
          # the tag has been checked for collisions.
          git checkout -- .
          echo "current=${current}" >> "$GITHUB_OUTPUT"
          echo "next=${next}" >> "$GITHUB_OUTPUT"
          echo "tag=v${next}" >> "$GITHUB_OUTPUT"
          echo "${current} -> ${next} (v${next})"

      - name: Refuse to reuse a tag
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.next.outputs.tag }}" >/dev/null; then
            echo "::error::${{ steps.next.outputs.tag }} already exists."
            exit 1
          fi
          echo "${{ steps.next.outputs.tag }} is free."

      - name: Apply the bump
        run: |
          set -Eeuo pipefail
          ./Scripts/version.sh set "${{ steps.next.outputs.next }}"
          ./Scripts/version.sh check

      # Promote "Unreleased" to the version being cut and open a fresh section,
      # so the changelog is never a release behind the tag.
      - name: Open the changelog section
        run: |
          python3 - "${{ steps.next.outputs.next }}" <<'PY'
          import datetime
          import pathlib
          import sys

          version = sys.argv[1]
          today = datetime.date.today().isoformat()
          path = pathlib.Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")

          heading = "## Unreleased"
          if heading not in text:
              raise SystemExit("CHANGELOG.md has no '## Unreleased' section to promote.")

          text = text.replace(
              heading,
              f"## Unreleased\n\n## {version} — {today}",
              1,
          )
          path.write_text(text, encoding="utf-8")
          print(f"Opened {version} — {today}")
          PY

      - name: Commit, tag and push
        if: ${{ !inputs.dry_run }}
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage every tracked file the bump touched rather than naming them:
          # this list was already wrong once — CITATION.cff was added to
          # version.sh afterwards and silently stopped being committed, leaving
          # master failing its own consistency check.
          git add -u
          git commit -m "Release ${{ steps.next.outputs.tag }}

          Version moved from ${{ steps.next.outputs.current }} to ${{ steps.next.outputs.next }}
          across VERSION, the Android manifest, the Apple project, and the
          landing page's structured data, and the changelog section was opened.

          Cut by the Release workflow."
          git tag -a "${{ steps.next.outputs.tag }}" -m "Diffuse ${{ steps.next.outputs.next }}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
          git push origin "${{ steps.next.outputs.tag }}"

      # A tag pushed with GITHUB_TOKEN does not start anything: GitHub
      # suppresses workflow triggers from events raised by the default token, to
      # stop workflows retriggering themselves. So the tag alone is inert, and
      # the platform builds have to be asked for by name, at that tag.
      #
      # Each is dispatched with --ref so `github.ref_name` inside them is the
      # tag, which is what they use for the version and the release name.
      - name: Start the platform release builds
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          tag="${{ steps.next.outputs.tag }}"
          failed=0

          # Dispatched at the tag, not at the branch: the Apple and macOS
          # workflows take their version from the ref they run on. That also
          # means the tag must already contain a workflow_dispatch trigger,
          # which it does, because it is cut from a branch that has one — a tag
          # made before this existed cannot be dispatched at all.
          #
          # release-android is the odd one out: it does not read the ref, it
          # takes the tag as a required input. Omitting it fails the dispatch
          # with "Required input 'tag' not provided".
          dispatch() {
            local workflow="$1"
            shift
            if gh workflow run "${workflow}" --ref "${tag}" "$@"; then
              echo "dispatched ${workflow} at ${tag}"
            else
              echo "::error::could not dispatch ${workflow} at ${tag}"
              failed=1
            fi
          }

          dispatch release-apple.yml
          dispatch release-macos.yml
          dispatch release-android.yml -f "tag=${tag}"

          exit "${failed}"

      # The whole point of this job is that a release exists afterwards. It
      # once reported success having produced nothing: the tag was pushed, no
      # build started, and no release was published. Reporting green for that is
      # worse than failing, because nobody goes looking.
      #
      # So the cut is not finished when the tag is pushed. It waits for the
      # three builds, then checks the release is actually there with files
      # attached, and fails if it is not.
      - name: Verify a release was actually produced
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          tag="${{ steps.next.outputs.tag }}"

          echo "Waiting for the builds triggered at ${tag}..."
          deadline=$(( SECONDS + 2400 ))
          while (( SECONDS < deadline )); do
            runs="$(gh run list --json status,conclusion,name,headBranch --limit 40 \
              --jq "[.[] | select(.headBranch == \"${tag}\")]")"
            total="$(jq -r 'length' <<< "${runs}")"
            finished="$(jq -r '[.[] | select(.status == "completed")] | length' <<< "${runs}")"
            if (( total >= 3 && finished == total )); then
              break
            fi
            sleep 30
          done

          echo "${runs}" | jq -r '.[] | "  \(.conclusion // .status)\t\(.name)"'
          if [[ "$(jq -r '[.[] | select(.conclusion != "success")] | length' <<< "${runs}")" != "0" ]]; then
            echo "::error::A platform release build did not succeed at ${tag}."
            exit 1
          fi

          # The builds passing is not the same as a release existing.
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            echo "::error::No GitHub Release exists for ${tag}, despite the builds succeeding."
            exit 1
          fi
          assets="$(gh release view "${tag}" --json assets --jq '.assets | length')"
          if [[ "${assets}" -eq 0 ]]; then
            echo "::error::Release ${tag} exists but has no files attached."
            exit 1
          fi
          echo "Release ${tag} is published with ${assets} file(s)."

      - name: Summary
        run: |
          {
            echo "### ${{ steps.next.outputs.tag }}"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| From | ${{ steps.next.outputs.current }} |"
            echo "| To | ${{ steps.next.outputs.next }} |"
            echo "| Bump | ${{ inputs.bump }} |"
            echo "| Dry run | ${{ inputs.dry_run }} |"
            echo
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "Nothing was pushed. Rerun with dry run off to cut it."
            else
              echo "Tag pushed and the platform release builds dispatched at it."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
