name: Android

on:
  pull_request:
    paths:
      - "Android/**"
      - "Fixtures/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main, master]
    paths:
      - "Android/**"
      - "Fixtures/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Test, lint, and build unsigned release
        working-directory: Android
        run: ./gradlew --no-daemon jacocoDebugUnitTestReport jacocoDebugUnitTestCoverageVerification assembleDebugAndroidTest lintDebug assembleRelease
      - name: Upload Android unit-test coverage
        uses: actions/upload-artifact@v4
        with:
          name: diffuse-android-unit-test-coverage
          path: |
            Android/app/build/reports/jacoco/jacocoDebugUnitTestReport/html/
            Android/app/build/reports/jacoco/jacocoDebugUnitTestReport/jacocoDebugUnitTestReport.xml
          if-no-files-found: error
          retention-days: 14
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: diffuse-android-unsigned
          path: Android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  instrumented-tests:
    runs-on: ubuntu-latest
    # The emulator suite used to run cold: it re-downloaded the system image,
    # created the AVD, and cold-booted on every run, then had 30 minutes to
    # also build and run the tests. It did not fit, and a job killed by
    # timeout-minutes is reported as "cancelled", so the failure looked like
    # an infrastructure blip instead of a budget that was simply too small.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # `chmod` inside an `if [[ -e /dev/kvm ]]` silently does nothing when the
      # node has not appeared yet, and the emulator then falls back to software
      # CPU emulation, which is roughly an order of magnitude slower. The udev
      # rule is the reliable way to get hardware acceleration on a runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Cache the AVD and its snapshot. The first run pays for creation and a
      # cold boot; every later run restores a booted snapshot instead.
      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-android-34-pixel6

      - name: Create AVD and cache a booted snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: diffuse-ci
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD created and snapshotted."

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: diffuse-ci
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Window, transition and animator scales off: Compose and Espresso
          # both wait on animations, so this is a correctness win as well as a
          # speed one.
          disable-animations: true
          working-directory: Android
          script: ./gradlew connectedDebugAndroidTest

      # `if: failure()` never fires when a job is killed by timeout-minutes,
      # because that outcome is "cancelled". This is the step that was supposed
      # to explain the last three timeouts and stayed silent through all of them.
      # Bounded, and guarded on a device actually being present.
      #
      # `adb logcat` blocks waiting for a device when none is attached, and by
      # the time this runs the emulator action has already torn its emulator
      # down. So a failing test used to hang here until the job's own
      # timeout-minutes killed it — three minutes of tests followed by fifty
      # minutes of nothing, reported as "cancelled".
      #
      # The cancellation also meant GitHub never finalised the log blob, so the
      # step that exists to explain a failure was the reason no explanation
      # survived. Hence both the timeout and the report upload below.
      - name: Emulator and test diagnostics
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 3
        run: |
          echo "::group::Gradle test reports"
          find Android/app/build/reports -name '*.html' -o -name '*.xml' 2>/dev/null | head -20 || true
          echo "::endgroup::"

          echo "::group::Device state"
          timeout 30 adb devices || true
          if timeout 30 adb get-state >/dev/null 2>&1; then
            echo "::endgroup::"
            echo "::group::logcat (last 300 lines)"
            timeout 60 adb logcat -d -t 300 || true
          else
            echo "No device attached — the emulator is already gone, so there is"
            echo "no logcat to read. Skipping rather than blocking on it."
            echo "::endgroup::"
            echo "::group::logcat"
            echo "(unavailable)"
          fi
          echo "::endgroup::"

      # Uploaded on failure specifically: when a job is cancelled GitHub never
      # publishes its logs, so without this a failing instrumentation run leaves
      # nothing behind to diagnose from.
      - name: Upload instrumentation reports
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: diffuse-android-instrumentation-reports
          path: |
            Android/app/build/reports/androidTests/
            Android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 7
