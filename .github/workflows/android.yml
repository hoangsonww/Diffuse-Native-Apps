name: Android

on:
  pull_request:
    paths:
      - "Android/**"
      - "Fixtures/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main, master]
    paths:
      - "Android/**"
      - "Fixtures/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Test, lint, and build unsigned release
        working-directory: Android
        run: ./gradlew --no-daemon jacocoDebugUnitTestReport jacocoDebugUnitTestCoverageVerification assembleDebugAndroidTest lintDebug assembleRelease
      - name: Upload Android unit-test coverage
        uses: actions/upload-artifact@v7
        with:
          name: diffuse-android-unit-test-coverage
          path: |
            Android/app/build/reports/jacoco/jacocoDebugUnitTestReport/html/
            Android/app/build/reports/jacoco/jacocoDebugUnitTestReport/jacocoDebugUnitTestReport.xml
          if-no-files-found: error
          retention-days: 14
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: diffuse-android-unsigned
          path: Android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  instrumented-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install emulator image
        run: sdkmanager "platform-tools" "emulator" "platforms;android-36" "build-tools;35.0.0" "system-images;android-34;google_apis;x86_64"
      - name: Enable emulator acceleration
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi
      - name: Create Android 14 emulator
        run: avdmanager create avd --force --name diffuse-ci --package "system-images;android-34;google_apis;x86_64" --device pixel_6 <<< "no"
      - name: Run instrumented tests
        working-directory: Android
        run: |
          "$ANDROID_HOME/emulator/emulator" -avd diffuse-ci -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect >/tmp/diffuse-emulator.log 2>&1 &
          adb wait-for-device
          timeout 300 bash -c 'until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == "1" ]]; do sleep 2; done'
          adb shell input keyevent 82
          ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Show emulator log after failure
        if: failure()
        run: tail -n 300 /tmp/diffuse-emulator.log || true
