name: CI

# The Apple matrix is eight macOS jobs. Prose, screenshots, and the marketing
# site cannot break a Swift build, so they do not get to spend it. Anything
# that can affect compilation — sources, Package.swift, project.yml, scripts,
# fixtures, or this workflow — is absent from the ignore list and still runs.
on:
  pull_request:
    paths-ignore: &docs
      - "**/*.md"
      - "Documentation/**"
      - "docs/**"
      - "web/**"
      - "index.html"
      - "404.html"
      - "*.txt"
      - "sitemap.xml"
      - "robots.txt"
      - "site.webmanifest"
      - "LICENSE"
      - "CITATION.cff"
      - ".well-known/**"
      - ".agents/**"
      - ".claude/**"
      - ".cursor/**"
      - ".codex/**"
      - ".github/ISSUE_TEMPLATE/**"
  push:
    branches: [main, master]
    paths-ignore: *docs
  workflow_dispatch:

# Unsigned, hermetic, first-party. No developer-account secrets, no code
# scanning products, no third-party linters that natter about style the
# repo does not use.

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  format:
    name: Format
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftFormat
        run: brew install swiftformat
      - name: Lint
        run: swiftformat Packages Apps Tools Tests --config .swiftformat --lint

  test:
    name: Package tests
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Cache Swift PM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-
      - name: Swift tests with coverage
        run: ./Scripts/coverage.sh
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/summary.md ]; then
            cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  crosscheck:
    name: SDK cross-check (${{ matrix.platform }})
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, watchos]
    steps:
      - uses: actions/checkout@v4
      - name: Type-check shared packages
        run: ./Scripts/crosscheck.sh ${{ matrix.platform }}

  build:
    name: Build ${{ matrix.scheme }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: DiffuseMac
            destination: generic/platform=macOS
          - scheme: DiffuseiOS
            destination: generic/platform=iOS
          - scheme: DiffuseiPadOS
            destination: generic/platform=iOS
          - scheme: DiffuseWatch
            destination: generic/platform=watchOS
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned
        run: |
          xcodebuild \
            -project Diffuse.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -configuration Release \
            -destination "${{ matrix.destination }}" \
            -derivedDataPath .build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            build

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -x Scripts/*.sh Scripts/hooks/*.sh .claude/hooks/*.sh

      # VERSION is the only place a human edits it; the Android manifest, the
      # Apple project, and the landing page's structured data are derived. They
      # had already drifted once — v1.1.0 shipped while every file still said
      # 1.0.0 — so the agreement is now enforced rather than assumed.
      - name: Version consistency
        run: ./Scripts/version.sh check

  docker:
    name: Docker toolbox image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # Scoped to this job so every other job keeps a read-only token.
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # A pull request builds but never publishes. A fork's GITHUB_TOKEN cannot
      # write packages anyway, and pushing an image built from unreviewed code
      # to a tag other people pull is not something a green check should do.
      - name: Decide whether this run publishes
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "Pull request: building only, not publishing."
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "Branch build: publishing to GHCR."
          fi

      - name: Collect tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/diffuse-dev
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # linux/amd64 only, deliberately. Google ships the Android command-line
      # tools and build-tools as x86_64 Linux binaries, so an arm64 image would
      # build cleanly and then fail at aapt2 and d8 — a worse outcome than not
      # offering the architecture. docker-compose.yml pins the same platform.
      #
      # Built and verified before anything is published, so a broken image
      # cannot reach a tag someone else pulls. The publish step reuses this
      # layer cache, which matters here: the Android SDK download is the
      # expensive part of this build.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: diffuse-dev:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # An image that builds but is missing a toolchain is worse than no image,
      # because it fails later and further from the cause. Each check runs in a
      # login shell, which is what `docker compose exec dev bash` gives you and
      # which resets PATH — so this also proves the /usr/local/bin symlinks in
      # the Dockerfile are doing their job.
      - name: Verify the toolchain inside the image
        run: |
          set -Eeuo pipefail
          image="diffuse-dev:ci-${{ github.sha }}"
          echo "--- the image must carry a JDK 17 ---"
          docker run --rm "$image" bash -lc 'java -version 2>&1 | head -1 | grep -q "17\."'
          echo "--- the Android SDK entry points must resolve in a login shell ---"
          docker run --rm "$image" bash -lc 'adb --version >/dev/null && sdkmanager --version >/dev/null'
          echo "--- Node and the installed dependencies must be present ---"
          docker run --rm "$image" bash -lc 'node --version >/dev/null && test -d /workspace/node_modules'
          echo "--- the shell tools the hooks and scripts rely on must exist ---"
          docker run --rm "$image" bash -lc 'command -v git make jq python3 shellcheck >/dev/null'
          echo "Toolchain verified."

      # Asserting that adb and sdkmanager exist proves the binaries are present,
      # not that this image can still build the app — an SDK bump, a Gradle
      # bump, or a missing platform breaks the build while leaving every
      # binary check green. So build the real thing inside the published image.
      #
      # android.yml already builds Android on a bare runner. That covers the
      # code; this covers the container, and the two fail for different reasons.
      # Reused across runs so the container build stops re-resolving the whole
      # dependency graph from Maven Central, which answers anonymous traffic
      # with 429 under load. android.yml already resolves these once per push;
      # without this, adding the container build doubled that traffic.
      - name: Cache the Gradle dependencies the container build resolves
        uses: actions/cache@v4
        with:
          path: ~/.gradle-container
          key: gradle-container-${{ hashFiles('Android/build.gradle.kts', 'Android/settings.gradle.kts', 'Android/app/build.gradle.kts', 'Android/gradle.properties', 'Android/gradle/wrapper/gradle-wrapper.properties', 'Android/gradle/gradle-daemon-jvm.properties') }}
          restore-keys: |
            gradle-container-

      - name: Build the Android app inside the image
        run: |
          set -Eeuo pipefail
          mkdir -p "$HOME/.gradle-container"
          log="$(mktemp)"
          for attempt in 1 2 3; do
            if docker run --rm \
              -v "$PWD:/workspace" \
              -v "$HOME/.gradle-container:/root/.gradle" \
              -w /workspace/Android \
              "diffuse-dev:ci-${{ github.sha }}" \
              bash -lc './gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug' 2>&1 | tee "$log"; then
              break
            fi
            # Only an upstream rate limit earns a retry. A real build failure has
            # to fail on the first attempt, or this stops being resilience and
            # starts being a way to hide a flaky build.
            if ! grep -qE "Too Many Requests|status code 429" "$log"; then
              echo "Failed for a reason that is not upstream rate limiting. Not retrying."
              exit 1
            fi
            if [ "$attempt" = 3 ]; then
              echo "Maven Central still rate limiting after 3 attempts."
              exit 1
            fi
            echo "Maven Central returned 429. Backing off before attempt $((attempt + 1))."
            sleep $((attempt * 45))
          done

          # The container runs as root, so everything it wrote into the mounted
          # workspace — Android/app/build in particular — is root-owned. Any
          # later step that walks the tree then fails on it, which is how the
          # cache post-step died with "Fail to hash files under directory".
          # Hand it back before anything else looks at it.
          sudo chown -R "$(id -u):$(id -g)" Android "$HOME/.gradle-container"
          echo "--- the build must have produced a real APK ---"
          apk="$(find Android -name '*-debug.apk' -print -quit)"
          test -n "$apk" && test -s "$apk"
          unzip -l "$apk" | grep -q AndroidManifest.xml
          echo "Container-built APK verified: $apk ($(du -h "$apk" | cut -f1))"

      - name: Upload the container-built debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk-container-built
          path: Android/**/*-debug.apk
          if-no-files-found: warn

      - name: Log in to GHCR
        if: steps.mode.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: steps.mode.outputs.push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  # Single required check for branch protection: every matrix cell above
  # must have succeeded. Do not add CodeQL, Super-Linter, or scorecard jobs.
  ci:
    name: All green
    if: always()
    needs: [format, test, crosscheck, build, scripts, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check job results
        run: |
          set -- \
            "${{ needs.format.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.crosscheck.result }}" \
            "${{ needs.build.result }}" \
            "${{ needs.scripts.result }}" \
            "${{ needs.docker.result }}"
          for result in "$@"; do
            echo "$result"
            [ "$result" = success ] || exit 1
          done
