name: Release Android

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach the APK to (e.g. v1.2.0)"
        required: true
        type: string

# Unsigned release APK, matching the unsigned stance of release-apple.yml.
# This is a build artifact for testers, not a Play Store package: no signing
# keys, no keystore, no Play Console. Installing it requires allowing unknown
# sources on the device.

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Version from tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Verify before publishing
        working-directory: Android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

      - name: Build the unsigned release APK
        working-directory: Android
        run: ./gradlew --no-daemon assembleRelease

      - name: Stage artifact
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          APK=$(find Android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -1)
          test -n "$APK" || { echo "No APK produced" >&2; exit 1; }
          NAME="Diffuse-android-v${VERSION}-unsigned.apk"
          cp "$APK" "dist/${NAME}"
          (cd dist && sha256sum "$NAME" > "SHA256SUMS-android")
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Diffuse-android-v${{ steps.ver.outputs.version }}
          path: dist/
          if-no-files-found: error

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: |
            dist/*.apk
            dist/SHA256SUMS-android
          generate_release_notes: true
          append_body: true
