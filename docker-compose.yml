# Optional local toolbox. Does not build the Apple apps.
#
#   docker compose up -d
#   docker compose exec dev bash
#   docker compose down

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: diffuse-dev:local
    working_dir: /workspace
    volumes:
      - .:/workspace
    stdin_open: true
    tty: true
    command: sleep infinity
